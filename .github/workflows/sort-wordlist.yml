name: Sort password list

# Runs whenever SambaTu.txt changes on main (direct commit or PR merge),
# rewriting it in sorted, deduplicated order so third-party tools can
# index it and do fast lookups (e.g. binary search) on the file.
on:
  push:
    branches: [main]
    paths:
      - "SambaTu.txt"
  workflow_dispatch: {}

# Cancel any run still in progress if the file changes again before it finishes.
concurrency:
  group: sort-wordlist-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sort:
    runs-on: ubuntu-latest
    # Hard cap on the whole job so a stuck run can't burn free-tier minutes.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize and sort wordlist
        timeout-minutes: 5
        run: bash scripts/sort-wordlist.sh SambaTu.txt

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- SambaTu.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push sorted list
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SambaTu.txt
          git commit -m "chore: sort and deduplicate SambaTu.txt [skip ci]"
          git push
